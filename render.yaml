services:
  - type: web
    name: togcode-ai-backend
    env: node
    region: ohio
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CEREBRAS_API_KEY
        sync: false

  - type: web
    name: togcode-ai-frontend
    env: static
    rootDir: .
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: togcode-ai-backend
          type: web
          property: host
      - key: REACT_APP_API_KEY
        sync: false
      - key: REACT_APP_AUTH_DOMAIN
        sync: false
      - key: REACT_APP_DATABASE_URL
        sync: false
      - key: REACT_APP_PROJECT_ID
        sync: false
      - key: REACT_APP_STORAGE_BUCKET
        sync: false
      - key: REACT_APP_MESSAGING_SENDER_ID
        sync: false
      - key: REACT_APP_APP_ID
        sync: false
